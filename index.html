<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PNRR — Mappa degli Investimenti</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #0066CC;
    --blue-dark: #004D99;
    --blue-light: #E8F1FB;
    --green: #008055;
    --green-light: #E6F4EF;
    --red: #CC334F;
    --gray-100: #F5F6F7;
    --gray-200: #E8EAED;
    --gray-400: #9EA4AC;
    --gray-700: #3D4045;
    --white: #FFFFFF;
    --sidebar: 780px;
    --header: 64px;
  }

  body {
    font-family: 'Titillium Web', sans-serif;
    background: var(--gray-100);
    color: var(--gray-700);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  header {
    height: var(--header);
    background: var(--blue-dark);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
    z-index: 1000;
    flex-shrink: 0;
  }
  .gov-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    color: white;
    text-decoration: none;
  }
  .gov-logo svg { width: 36px; height: 36px; }
  .gov-logo-text { display: flex; flex-direction: column; }
  .gov-logo-text .title { font-size: 18px; font-weight: 700; letter-spacing: .5px; }
  .gov-logo-text .sub { font-size: 11px; font-weight: 300; opacity: .85; letter-spacing: 1px; text-transform: uppercase; }
  .header-divider { width: 1px; height: 36px; background: rgba(255,255,255,.3); margin: 0 8px; }
  .header-badge {
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.3);
    color: white;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    letter-spacing: .5px;
  }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .level-pills { display: flex; gap: 4px; }
  .level-pill {
    cursor: pointer;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    border: 1.5px solid rgba(255,255,255,.4);
    color: rgba(255,255,255,.7);
    transition: all .2s;
    background: transparent;
    letter-spacing: .3px;
  }
  .level-pill.active {
    background: white;
    color: var(--blue-dark);
    border-color: white;
  }
  .level-pill:hover:not(.active) { border-color: white; color: white; }
  .mode-toggle {
    display: flex;
    gap: 0;
    border: 1.5px solid rgba(255,255,255,.4);
    border-radius: 20px;
    overflow: hidden;
  }
  .mode-btn {
    cursor: pointer;
    padding: 5px 12px;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,.65);
    background: transparent;
    border: none;
    transition: all .2s;
    letter-spacing: .3px;
  }
  .mode-btn.active { background: white; color: var(--blue-dark); }
  .mode-btn:hover:not(.active) { color: white; }

  /* ── LAYOUT ── */
  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ── MAP ── */
  #map {
    flex: 1;
    z-index: 1;
    position: relative;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: var(--sidebar);
    background: white;
    border-left: 1px solid var(--gray-200);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 10;
    box-shadow: -4px 0 16px rgba(0,0,0,.06);
  }

  .sidebar-header {
    padding: 20px 20px 0;
    border-bottom: 1px solid var(--gray-200);
    flex-shrink: 0;
  }
  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--gray-400);
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .breadcrumb span { cursor: pointer; transition: color .15s; }
  .breadcrumb span:hover { color: var(--blue); }
  .breadcrumb span.active { color: var(--blue); font-weight: 600; }
  .breadcrumb .sep { color: var(--gray-200); cursor: default; }
  .sidebar-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--gray-700);
    margin-bottom: 4px;
    line-height: 1.2;
  }
  .sidebar-subtitle {
    font-size: 12px;
    color: var(--gray-400);
    margin-bottom: 16px;
  }

  .sidebar-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px 24px;
  }
  .sidebar-body::-webkit-scrollbar { width: 4px; }
  .sidebar-body::-webkit-scrollbar-thumb { background: var(--gray-200); border-radius: 4px; }

  /* ── KPI CARDS ── */
  .kpi-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .kpi {
    background: var(--gray-100);
    border-radius: 10px;
    padding: 14px 14px 12px;
    border: 1px solid var(--gray-200);
  }
  .kpi.accent { background: var(--blue-light); border-color: #C2D9F0; }
  .kpi.green-accent { background: var(--green-light); border-color: #A8DECE; }
  .kpi-label { font-size: 10px; font-weight: 600; color: var(--gray-400); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 4px; }
  .kpi-value { font-size: 22px; font-weight: 700; color: var(--gray-700); line-height: 1; }
  .kpi.accent .kpi-value { color: var(--blue-dark); }
  .kpi.green-accent .kpi-value { color: var(--green); }
  .kpi-unit { font-size: 11px; font-weight: 400; color: var(--gray-400); margin-top: 2px; }

  /* ── SECTION ── */
  .section { margin-bottom: 20px; }
  .section-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gray-400);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--gray-200); }

  /* ── STATUS BAR ── */
  .status-bar { display: flex; gap: 6px; margin-bottom: 8px; }
  .status-item {
    flex: 1;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .3px;
  }
  .status-item.attivo { background: #E6F4EF; color: var(--green); }
  .status-item.chiuso { background: #FDECEA; color: var(--red); }
  .status-item .val { font-size: 18px; display: block; margin-bottom: 2px; }

  /* ── BAR LIST ── */
  .bar-list { display: flex; flex-direction: column; gap: 8px; }
  .bar-item {}
  .bar-label { font-size: 11px; font-weight: 600; color: var(--gray-700); margin-bottom: 3px; display: flex; justify-content: space-between; }
  .bar-label span { color: var(--gray-400); font-weight: 400; }
  .bar-track { height: 6px; background: var(--gray-200); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; background: var(--blue); transition: width .4s ease; }
  .bar-fill.green { background: var(--green); }
  .bar-fill.orange { background: #E07A20; }

  /* ── CHART ── */
  .chart-wrap { position: relative; height: 180px; margin-bottom: 8px; }
  .pie-wrap { position: relative; width: 100%; height: 260px; margin-bottom: 4px; }

  /* ── DRILL LIST ── */
  .drill-list { display: flex; flex-direction: column; gap: 4px; }
  .drill-item {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s;
    border: 1px solid transparent;
    gap: 10px;
  }
  .drill-item:hover { background: var(--blue-light); border-color: #C2D9F0; }
  .drill-item.comune-item:hover { background: var(--green-light); border-color: #A8DECE; }
  .drill-item-name { font-size: 13px; font-weight: 600; flex: 1; }
  .drill-item-meta { font-size: 11px; color: var(--gray-400); text-align: right; }
  .drill-item-cost { font-size: 13px; font-weight: 700; color: var(--blue); }
  .drill-item.comune-item .drill-item-cost { color: var(--green); }
  .drill-arrow { color: var(--gray-400); font-size: 14px; }

  /* ── BACK BUTTON ── */
  .back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--blue);
    cursor: pointer;
    padding: 6px 0;
    border: none;
    background: none;
    margin-bottom: 12px;
    transition: opacity .15s;
  }
  .back-btn:hover { opacity: .75; }

  /* ── LOADING ── */
  .loading {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    flex-direction: column;
    gap: 16px;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--gray-200);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; color: var(--gray-400); font-weight: 600; }

  /* ── TOOLTIP ── */
  .map-tooltip {
    background: white;
    border: none;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,.15);
    padding: 12px 14px;
    font-family: 'Titillium Web', sans-serif;
    font-size: 13px;
    min-width: 200px;
  }
  .map-tooltip strong { display: block; font-size: 14px; font-weight: 700; color: var(--gray-700); margin-bottom: 6px; }
  .map-tooltip .tt-row { display: flex; justify-content: space-between; gap: 12px; color: var(--gray-400); font-size: 12px; margin-top: 3px; }
  .map-tooltip .tt-row b { color: var(--gray-700); }
  .map-tooltip .tt-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600; padding: 1px 7px;
    border-radius: 8px; margin-top: 6px;
  }
  .map-tooltip .tt-badge.red { background: #FDECEA; color: var(--red); }
  .map-tooltip .tt-badge.green { background: var(--green-light); color: var(--green); }

  /* ── LEGEND ── */
  .legend {
    background: white;
    border-radius: 10px;
    padding: 12px 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,.1);
    font-family: 'Titillium Web', sans-serif;
    font-size: 11px;
    min-width: 140px;
  }
  .legend h4 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--gray-400); margin-bottom: 8px; }
  .legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .legend-swatch { width: 16px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  /* ── FOOTER ── */
  .map-footer {
    position: absolute;
    bottom: 10px;
    left: 10px;
    background: white;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 10px;
    color: var(--gray-400);
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    z-index: 500;
    letter-spacing: .3px;
  }

  /* ── EFFICIENCY ── */
  .efficiency-bar {
    display: flex;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    margin: 6px 0 4px;
    background: var(--gray-200);
  }
  .efficiency-bar .ontime { background: var(--green); }
  .efficiency-bar .overdue { background: var(--red); }
  .eff-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--gray-400); }
  .eff-row b { font-weight: 700; }
  .eff-row .good { color: var(--green); }
  .eff-row .bad { color: var(--red); }
  .delay-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
  }
  .delay-badge.good { background: #E6F4EF; color: var(--green); }
  .delay-badge.bad  { background: #FDECEA; color: var(--red); }

  /* ── TAG CLOUD ── */
  .tag-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag {
    padding: 3px 9px; border-radius: 10px; font-size: 10px; font-weight: 600;
    background: var(--gray-100); color: var(--gray-700); border: 1px solid var(--gray-200);
  }
  .tag.blue { background: var(--blue-light); color: var(--blue-dark); border-color: #C2D9F0; }
  .tag.green { background: var(--green-light); color: var(--green); border-color: #A8DECE; }
  .tag.source { background: #FFF8E1; color: #8B6914; border-color: #FFE082; }

  /* ── PILL BADGES ── */
  .pill-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .pill {
    padding: 2px 10px; border-radius: 12px; font-size: 10px; font-weight: 700;
    letter-spacing: .3px;
  }
  .pill.anac { background: #E3F2FD; color: #1565C0; }
  .pill.italiadomani { background: var(--green-light); color: var(--green); }
  .pill.neutral { background: var(--gray-100); color: var(--gray-700); border: 1px solid var(--gray-200); }

  /* ── SOGGETTI LIST ── */
  .soggetti-list { display: flex; flex-direction: column; gap: 6px; }
  .soggetto-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    padding: 8px 10px;
    background: var(--gray-100);
    border-radius: 6px;
    border: 1px solid var(--gray-200);
  }
  .soggetto-name { font-size: 11px; font-weight: 600; color: var(--gray-700); flex: 1; line-height: 1.3; }
  .soggetto-count { font-size: 11px; font-weight: 700; color: var(--blue); white-space: nowrap; }

  /* ── EMPTY STATE ── */
  .empty { text-align: center; padding: 32px 16px; color: var(--gray-400); font-size: 13px; }
  .warning-banner { background:#FFF8E1; border:1.5px solid #FFD54F; border-radius:10px; padding:12px 14px; margin-bottom:16px; font-size:12px; color:#5D4037; }
  .warning-banner .wt { font-weight:700; margin-bottom:4px; }
  .warning-banner .wb { color:#795548; }

  /* ── COMUNE HIGHLIGHT ── */
  .comune-highlight {
    background: linear-gradient(135deg, #F0FAF6 0%, #E6F4EF 100%);
    border: 2px solid #A8DECE;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .comune-highlight-icon {
    width: 36px; height: 36px;
    background: var(--green);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .comune-highlight-text .lbl { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; color: var(--green); }
  .comune-highlight-text .val { font-size: 18px; font-weight: 700; color: #0A5A4A; }
</style>
</head>
<body>

<header>
  <div class="gov-logo">
    <svg viewBox="0 0 36 36" fill="none">
      <rect width="36" height="36" rx="6" fill="rgba(255,255,255,0.15)"/>
      <path d="M18 6l2.5 7.5H28l-6.5 4.5 2.5 7.5L18 21l-6 4.5 2.5-7.5L8 13.5h7.5L18 6z" fill="white"/>
    </svg>
    <div class="gov-logo-text">
      <span class="title">Italia Domani</span>
      <span class="sub">Piano Nazionale di Ripresa e Resilienza</span>
    </div>
  </div>
  <div class="header-divider"></div>
  <span class="header-badge">PNRR — Mappa degli Investimenti</span>
  <div class="header-right">
    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="cost" onclick="setMode('cost')">Investimento</button>
      <button class="mode-btn" data-mode="overdue" onclick="setMode('overdue')">Ritardi</button>
    </div>
    <div class="level-pills">
      <button class="level-pill active" data-level="region" onclick="setLevel('region')">Regioni</button>
      <button class="level-pill" data-level="province" onclick="setLevel('province')">Province</button>
      <button class="level-pill" data-level="comune" onclick="setLevel('comune')">Comuni</button>
    </div>
  </div>
</header>

<div class="main">
  <div id="map">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-text">Caricamento dati…</div>
    </div>
    <div class="map-footer">Fonte: OpenCUP · ANAC · Italia Domani &nbsp;|&nbsp; Aggiornamento: luglio 2026</div>
  </div>

  <div class="sidebar">
    <div class="sidebar-header">
      <div class="breadcrumb" id="breadcrumb">
        <span class="active" onclick="drillNational()">Italia</span>
      </div>
      <div class="sidebar-title" id="sidebar-title">Italia</div>
      <div class="sidebar-subtitle" id="sidebar-subtitle">Panoramica nazionale degli investimenti PNRR</div>
    </div>
    <div class="sidebar-body" id="sidebar-body">
      <div class="loading" style="position:relative;height:200px;background:transparent;">
        <div class="spinner"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let state = {
  level: 'region',          // 'region' | 'province' | 'comune'
  colorMode: 'cost',        // 'cost' | 'overdue'
  drillRegion: null,        // 2-digit region ISTAT code string
  drillProvince: null,      // 3-digit province ISTAT code string
  selectedComune: null,     // 6-digit comune ISTAT code string
};

// ═══════════════════════════════════════════════
// DATA CACHE
// ═══════════════════════════════════════════════
let DATA = {};
let geoRegions, geoProvinces, geoComuni = null;  // geoComuni lazy-loaded
let map, layerRegions, layerProvinces, layerComuni, legend;

// ═══════════════════════════════════════════════
// COLOR PALETTES
// ═══════════════════════════════════════════════
const PALETTE = {
  cost_region:    ['#D6E8FA','#A8CEEF','#6AAEE0','#3B8ED1','#1A6DB5','#0A4F8A','#052E52'],
  cost_province:  ['#D6E8FA','#A8CEEF','#6AAEE0','#3B8ED1','#1A6DB5','#0A4F8A','#052E52'],
  cost_comune:    ['#D6F0E8','#A8DECE','#6ABFAA','#3B9F88','#1A7D68','#0A5A4A','#03342A'],
  overdue_region: ['#FEF3F5','#F9CDD4','#F5B8C0','#EF8898','#E04060','#CC334F','#8B1020'],
  overdue_province:['#FEF3F5','#F9CDD4','#F5B8C0','#EF8898','#E04060','#CC334F','#8B1020'],
  overdue_comune: ['#FEF3F5','#F9CDD4','#F5B8C0','#EF8898','#E04060','#CC334F','#8B1020'],
};

function currentPalette(levelOverride) {
  const lvl = levelOverride || state.level;
  const mode = state.colorMode;
  return PALETTE[`${mode}_${lvl}`] || PALETTE[`${mode}_region`];
}

function getColor(val, max, palette) {
  if (!val || !max) return palette[0];
  const t = Math.min(val / (max * 0.85), 1);
  const idx = Math.floor(t * (palette.length - 1));
  return palette[Math.min(idx, palette.length - 1)];
}

// ═══════════════════════════════════════════════
// FORMAT HELPERS
// ═══════════════════════════════════════════════
function fmtEur(v) {
  if (v == null || isNaN(v)) return '—';
  if (v >= 1e9) return (v / 1e9).toFixed(1) + ' Mld €';
  if (v >= 1e6) return (v / 1e6).toFixed(0) + ' Mln €';
  if (v >= 1e3) return (v / 1e3).toFixed(0) + ' K €';
  return v.toFixed(0) + ' €';
}
function fmtN(v) {
  if (v == null) return '0';
  return (+v).toLocaleString('it-IT');
}
function capitalize(s) {
  if (!s) return '';
  return s.toLowerCase().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}
function capFirst(s) {
  if (!s) return '';
  return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
}

// ═══════════════════════════════════════════════
// DATA LOADING
// ═══════════════════════════════════════════════
async function loadData() {
  const [nat, reg, prov, geoR, geoP, com] = await Promise.all([
    fetch('data/national.json').then(r => r.json()),
    fetch('data/regions.json').then(r => r.json()),
    fetch('data/provinces.json').then(r => r.json()),
    fetch('data/regions.geojson').then(r => r.json()),
    fetch('data/provinces.geojson').then(r => r.json()),
    fetch('data/comuni.json').then(r => r.json()),
  ]);
  DATA.national = nat;
  DATA.regions = Object.fromEntries(reg.map(r => [r.code, r]));
  DATA.provinces = Object.fromEntries(prov.map(p => [p.code, p]));
  // comuni keyed by code, skip the special TUTTI record
  DATA.comuni = Object.fromEntries(com.filter(c => c.code !== '-1').map(c => [c.code, c]));
  geoRegions = geoR;
  geoProvinces = geoP;

  document.getElementById('loading').style.display = 'none';
  initMap();
  renderNational();
}

async function ensureGeoComuni() {
  if (geoComuni) return;
  geoComuni = await fetch('data/comuni_simple.geojson').then(r => r.json());
}

// ═══════════════════════════════════════════════
// MAP INIT
// ═══════════════════════════════════════════════
function initMap() {
  map = L.map('map', {
    center: [41.9, 12.5],
    zoom: 6,
    zoomControl: true,
    attributionControl: false,
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
  }).addTo(map);

  drawRegions();
  addLegend();
}

// ═══════════════════════════════════════════════
// CLEAR LAYERS HELPER
// ═══════════════════════════════════════════════
function clearLayer(ref) {
  if (ref && map.hasLayer(ref)) map.removeLayer(ref);
  return null;
}
function clearAllLayers() {
  layerRegions  = clearLayer(layerRegions);
  layerProvinces = clearLayer(layerProvinces);
  layerComuni   = clearLayer(layerComuni);
}

// ═══════════════════════════════════════════════
// DRAW REGIONS
// ═══════════════════════════════════════════════
function drawRegions() {
  layerRegions = clearLayer(layerRegions);
  const isOverdue = state.colorMode === 'overdue';
  const palette = currentPalette('region');
  const vals = Object.values(DATA.regions).map(r => isOverdue ? (r.n_overdue||0) : r.cost_total_eur);
  const max = Math.max(...vals);

  layerRegions = L.geoJSON(geoRegions, {
    style: f => {
      const code = String(f.properties.reg_istat_code).padStart(2,'0');
      const d = DATA.regions[code];
      const val = d ? (isOverdue ? (d.n_overdue||0) : d.cost_total_eur) : 0;
      return { fillColor: getColor(val, max, palette), weight: 1.5, color: 'white', fillOpacity: 0.82 };
    },
    onEachFeature: (f, layer) => {
      const code = String(f.properties.reg_istat_code).padStart(2,'0');
      const d = DATA.regions[code];
      layer.on({
        mouseover: e => {
          e.target.setStyle({ weight: 2.5, color: '#0066CC', fillOpacity: 0.95 });
          if (d) layer.bindTooltip(buildTooltip(capitalize(d.name), d), { sticky: true, className: 'map-tooltip', opacity: 1 }).openTooltip();
        },
        mouseout: e => { layerRegions && layerRegions.resetStyle(e.target); layer.closeTooltip(); },
        click: () => drillRegion(code),
      });
    },
  }).addTo(map);
}

// ═══════════════════════════════════════════════
// DRAW PROVINCES
// ═══════════════════════════════════════════════
function drawProvinces(filterRegCode) {
  layerProvinces = clearLayer(layerProvinces);

  const filteredFeatures = filterRegCode
    ? geoProvinces.features.filter(f => String(f.properties.reg_istat_code).padStart(2,'0') === filterRegCode)
    : geoProvinces.features;

  const isOverdue = state.colorMode === 'overdue';
  const palette = currentPalette('province');
  const vals = filteredFeatures.map(f => {
    const code = String(f.properties.prov_istat_code).padStart(3,'0');
    const d = DATA.provinces[code];
    return d ? (isOverdue ? (d.n_overdue||0) : d.cost_total_eur) : 0;
  });
  const max = Math.max(...vals);

  layerProvinces = L.geoJSON({ type:'FeatureCollection', features: filteredFeatures }, {
    style: f => {
      const code = String(f.properties.prov_istat_code).padStart(3,'0');
      const d = DATA.provinces[code];
      const val = d ? (isOverdue ? (d.n_overdue||0) : d.cost_total_eur) : 0;
      return { fillColor: getColor(val, max, palette), weight: 1, color: 'white', fillOpacity: 0.82 };
    },
    onEachFeature: (f, layer) => {
      const code = String(f.properties.prov_istat_code).padStart(3,'0');
      const d = DATA.provinces[code];
      layer.on({
        mouseover: e => {
          e.target.setStyle({ weight: 2.5, color: '#0A4F8A', fillOpacity: 0.95 });
          if (d) layer.bindTooltip(buildTooltip(capitalize(d.name), d), { sticky: true, className: 'map-tooltip', opacity: 1 }).openTooltip();
        },
        mouseout: e => { layerProvinces && layerProvinces.resetStyle(e.target); layer.closeTooltip(); },
        click: () => goProvince(code),
      });
    },
  }).addTo(map);
}

// ═══════════════════════════════════════════════
// DRAW COMUNI
// ═══════════════════════════════════════════════
function drawComuni(filterProvCode) {
  layerComuni = clearLayer(layerComuni);

  const filteredFeatures = filterProvCode
    ? geoComuni.features.filter(f => {
        const prov = String(f.properties.prov_istat_code).padStart(3,'0');
        return prov === filterProvCode;
      })
    : geoComuni.features;

  const isOverdue = state.colorMode === 'overdue';
  const palette = currentPalette('comune');
  const vals = filteredFeatures.map(f => {
    const code = String(f.properties.com_istat_code);
    const d = DATA.comuni[code];
    return d ? (isOverdue ? (d.n_overdue||0) : d.cost_total_eur) : 0;
  });
  const max = Math.max(...vals);

  layerComuni = L.geoJSON({ type:'FeatureCollection', features: filteredFeatures }, {
    style: f => {
      const code = String(f.properties.com_istat_code);
      const d = DATA.comuni[code];
      const val = d ? (isOverdue ? (d.n_overdue||0) : d.cost_total_eur) : 0;
      return { fillColor: getColor(val, max, palette), weight: 0.5, color: 'white', fillOpacity: 0.85 };
    },
    onEachFeature: (f, layer) => {
      const code = String(f.properties.com_istat_code);
      const d = DATA.comuni[code];
      const name = d ? capitalize(d.name) : capitalize(f.properties.name);
      layer.on({
        mouseover: e => {
          e.target.setStyle({ weight: 2, color: '#0A5A4A', fillOpacity: 0.95 });
          layer.bindTooltip(buildTooltip(name, d || {}), { sticky: true, className: 'map-tooltip', opacity: 1 }).openTooltip();
        },
        mouseout: e => { layerComuni && layerComuni.resetStyle(e.target); layer.closeTooltip(); },
        click: () => {
          if (d) renderComune(code);
        },
      });
    },
  }).addTo(map);
}

// ═══════════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════════
function buildTooltip(name, d) {
  const hasOverdue = d.n_overdue != null && d.n_overdue > 0;
  const overdueColor = hasOverdue ? 'red' : 'green';
  const overdueLabel = hasOverdue
    ? `<div class="tt-badge red">${fmtN(d.n_overdue)} in ritardo</div>`
    : (d.n_overdue === 0 ? `<div class="tt-badge green">Nessun ritardo</div>` : '');

  return `<div class="map-tooltip">
    <strong>${name}</strong>
    <div class="tt-row">Investimento <b>${fmtEur(d.cost_total_eur)}</b></div>
    ${d.fin_pnrr ? `<div class="tt-row">Fin. PNRR <b>${fmtEur(d.fin_pnrr)}</b></div>` : ''}
    <div class="tt-row">Progetti <b>${fmtN(d.n_projects)}</b></div>
    ${overdueLabel}
  </div>`;
}

// ═══════════════════════════════════════════════
// LEGEND
// ═══════════════════════════════════════════════
function addLegend() {
  const LegendControl = L.Control.extend({
    onAdd: () => {
      const div = L.DomUtil.create('div', 'legend');
      div.id = 'legend-box';
      updateLegendContent();
      return div;
    }
  });
  legend = new LegendControl({ position: 'bottomright' });
  legend.addTo(map);
}

function updateLegendContent() {
  const div = document.getElementById('legend-box');
  if (!div) return;
  const mode = state.colorMode;
  const level = state.level;
  const isOverdue = mode === 'overdue';
  const palette = currentPalette(level);

  let title, labels;
  if (isOverdue) {
    title = 'Progetti in ritardo';
    labels = level === 'comune'
      ? ['0', '1–5', '5–20', '20–50', '50–200', '200–500', '> 500']
      : ['0', '1–10', '10–50', '50–100', '100–500', '500–1K', '> 1K'];
  } else {
    title = 'Investimento';
    if (level === 'region') {
      labels = ['< 500 Mln','500 Mln','1 Mld','2 Mld','4 Mld','6 Mld','> 8 Mld'];
    } else if (level === 'province') {
      labels = ['< 50 Mln','50 Mln','200 Mln','500 Mln','1 Mld','2 Mld','> 3 Mld'];
    } else {
      labels = ['< 5 Mln','5 Mln','20 Mln','50 Mln','100 Mln','500 Mln','> 1 Mld'];
    }
  }

  div.innerHTML = `<h4>${title}</h4>${palette.map((c,i) =>
    `<div class="legend-row"><div class="legend-swatch" style="background:${c}"></div>${labels[i]}</div>`
  ).join('')}`;
}

// ═══════════════════════════════════════════════
// DRILL NAVIGATION
// ═══════════════════════════════════════════════
function drillNational() {
  state.level = 'region';
  state.drillRegion = null;
  state.drillProvince = null;
  state.selectedComune = null;

  setLevelPills('region');
  clearAllLayers();
  drawRegions();
  map.flyTo([41.9, 12.5], 6, { duration: 1 });
  updateLegendContent();
  renderNational();
}

function drillRegion(code) {
  state.level = 'province';
  state.drillRegion = code;
  state.drillProvince = null;
  state.selectedComune = null;

  setLevelPills('province');
  clearAllLayers();
  drawProvinces(code);

  const regionFeature = geoRegions.features.find(f =>
    String(f.properties.reg_istat_code).padStart(2,'0') === code
  );
  if (regionFeature) {
    map.flyToBounds(L.geoJSON(regionFeature).getBounds(), { padding: [40,40], duration: 1 });
  }

  updateLegendContent();
  renderRegion(code);
}

// Province click: load comuni + zoom in
async function goProvince(code) {
  state.level = 'comune';
  state.drillProvince = code;
  state.selectedComune = null;

  setLevelPills('comune');
  clearAllLayers();

  // Show mini spinner overlay on map while loading
  showMapSpinner();
  await ensureGeoComuni();
  hideMapSpinner();

  // Find province geo feature for zoom
  const provFeat = geoProvinces.features.find(f =>
    String(f.properties.prov_istat_code).padStart(3,'0') === code
  );
  if (provFeat) {
    map.flyToBounds(L.geoJSON(provFeat).getBounds(), { padding: [30,30], duration: 1 });
  }

  // Also update drillRegion if needed
  if (provFeat && !state.drillRegion) {
    state.drillRegion = String(provFeat.properties.reg_istat_code).padStart(2,'0');
  }

  drawComuni(code);
  updateLegendContent();
  renderProvince(code);
}

// From level-pill "Comuni" button
async function showAllComuni() {
  // If we're already in a province, show that province's comuni
  if (state.drillProvince) {
    return goProvince(state.drillProvince);
  }
  // Global comuni view
  state.level = 'comune';
  state.drillProvince = null;
  state.selectedComune = null;

  setLevelPills('comune');
  clearAllLayers();

  showMapSpinner();
  await ensureGeoComuni();
  hideMapSpinner();

  map.flyTo([41.9, 12.5], 6, { duration: 1 });
  drawComuni(null);
  updateLegendContent();
  renderAllComuni();
}

function setMode(mode) {
  state.colorMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  updateLegendContent();

  // Redraw current layer
  if (state.level === 'region') drawRegions();
  else if (state.level === 'province') drawProvinces(state.drillRegion);
  else if (state.level === 'comune') drawComuni(state.drillProvince);
}

function setLevel(level) {
  if (level === 'region') {
    drillNational();
  } else if (level === 'province') {
    state.level = 'province';
    setLevelPills('province');
    clearAllLayers();
    drawProvinces(state.drillRegion);
    updateLegendContent();
    if (state.drillRegion) renderRegion(state.drillRegion);
    else renderAllProvinces();
  } else if (level === 'comune') {
    showAllComuni();
  }
}

function setLevelPills(active) {
  document.querySelectorAll('.level-pill').forEach(p => {
    p.classList.toggle('active', p.dataset.level === active);
  });
}

// ── PIE CHART ENGINE ──
let _pieQueue = [];
let _pieIdx = 0;

// Full-spectrum palette used for every pie chart
const SPECTRUM = [
  '#E63946','#F4722B','#F4A020','#F7C948','#8BC34A',
  '#2E9E4F','#00BCD4','#1565C0','#7B1FA2','#E91E8C',
  '#FF6F61','#43A047','#039BE5','#6D4C41','#546E7A',
];
const PIE_PALETTES = {
  blue: SPECTRUM, green: SPECTRUM, purple: SPECTRUM,
  orange: SPECTRUM, teal: SPECTRUM,
};

function pieBlock(title, dataObj, palette, maxItems = 7) {
  if (!dataObj) return '';
  const items = Object.entries(dataObj).sort((a,b)=>b[1]-a[1]).slice(0, maxItems);
  if (!items.length) return '';
  const id = `pie-${++_pieIdx}`;
  const colors = PIE_PALETTES[palette] || PIE_PALETTES.blue;
  _pieQueue.push({ id, labels: items.map(([s])=>capitalize(s)), data: items.map(([,n])=>n), colors });
  return `
    <div class="section">
      <div class="section-title">${title}</div>
      <div class="pie-wrap"><canvas id="${id}"></canvas></div>
    </div>`;
}

function flushPieCharts() {
  _pieQueue.forEach(({ id, labels, data, colors }) => {
    const el = document.getElementById(id);
    if (!el) return;
    new Chart(el, {
      type: 'doughnut',
      data: {
        labels,
        datasets: [{ data, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '48%',
        plugins: {
          legend: {
            position: 'bottom',
            labels: {
              font: { family: "'Titillium Web', sans-serif", size: 11 },
              color: '#3D4045',
              boxWidth: 12,
              padding: 10,
              generateLabels: chart => {
                const ds = chart.data.datasets[0];
                const total = ds.data.reduce((a,b)=>a+b,0);
                return chart.data.labels.map((lbl, i) => ({
                  text: `${lbl.length > 28 ? lbl.slice(0,27)+'…' : lbl} (${ds.data[i]})`,
                  fillStyle: ds.backgroundColor[i],
                  strokeStyle: '#fff',
                  lineWidth: 2,
                  index: i,
                  hidden: false,
                }));
              },
            },
          },
          tooltip: {
            callbacks: {
              label: ctx => {
                const total = ctx.dataset.data.reduce((a,b)=>a+b,0);
                const pct = ((ctx.parsed / total)*100).toFixed(1);
                return ` ${ctx.label}: ${ctx.parsed} (${pct}%)`;
              },
            },
          },
        },
      },
    });
  });
  _pieQueue = [];
}

      <div class="kpi">
        <div class="kpi-label">Progetti unici</div>

      </div>
      <div class="kpi">
        <div class="kpi-label">Gare d'appalto</div>
        <div class="kpi-value">${fmtN(d.n_tenders)}</div>
        <div class="kpi-unit">Codici CIG</div>
      </div>
    </div>

    ${statoBlock(d)}
    ${efficiencyBlock(d)}
    ${missioniBlock(d)}
    ${settoriBlock(d, '')}
    ${sottosettoriBlock(d, '')}
    ${categorieBlock(d)}
    ${natureBlock(d)}
    ${tipologieBlock(d)}
    ${fasiBlock(d)}

    <div class="section">
      <div class="section-title">Progetti per anno di decisione</div>
      <div class="chart-wrap"><canvas id="chart-year"></canvas></div>
    </div>

    <div class="section">
      <div class="section-title">Drill-down per regione</div>
      <div class="drill-list">
        ${Object.values(DATA.regions).sort((a,b)=>b.cost_total_eur-a.cost_total_eur).map(r=>`
          <div class="drill-item" onclick="drillRegion('${r.code}')">
            <div style="flex:1">
              <div class="drill-item-name">${capitalize(r.name)}</div>
              <div class="drill-item-meta">${fmtN(r.n_projects)} progetti · ${fmtN(r.n_overdue||0)} ritardi</div>

  if (byYear.length) drawYearChart('chart-year', byYear);

// ── REGION ──
function renderRegion(code) {
  resetPies();
  const d = DATA.regions[code];
  if (!d) return;
  const name = capitalize(d.name);

  // Provinces in this region
  const regionProvs = Object.values(DATA.provinces).filter(p => {
    const feat = geoProvinces.features.find(f =>
      String(f.properties.prov_istat_code).padStart(3,'0') === p.code
    );
    return feat && String(feat.properties.reg_istat_code).padStart(2,'0') === code;
  }).sort((a,b) => b.cost_total_eur - a.cost_total_eur);

  setBreadcrumb([
    {label:'Italia', action:'drillNational()'},
    {label:name, active:true},
  ]);
  setHeader(name, `${fmtN(d.n_projects)} progetti · ${fmtN(d.n_tenders)} gare d'appalto`);

  setSidebar(`
    <button class="back-btn" onclick="drillNational()">← Italia</button>
    ${financingKpis(d)}
    ${statoBlock(d)}
    ${efficiencyBlock(d)}
    ${missioniBlock(d)}
    ${settoriBlock(d, '')}
    ${sottosettoriBlock(d, '')}
    ${categorieBlock(d)}
    ${natureBlock(d)}
    ${tipologieBlock(d)}
    ${fasiBlock(d)}
    ${soggettiBlock(d)}
    ${fontiBlock(d)}

    <div class="section">
      <div class="section-title">Province della regione</div>
      <div class="drill-list">
        ${regionProvs.map(p=>`
          <div class="drill-item" onclick="goProvince('${p.code}')">
            <div style="flex:1">
              <div class="drill-item-name">${capitalize(p.name)}</div>
              <div class="drill-item-meta">${fmtN(p.n_projects)} progetti · ${fmtN(p.n_overdue||0)} ritardi</div>
            </div>
            <div class="drill-item-cost">${fmtEur(p.cost_total_eur)}</div>
            <div class="drill-arrow">›</div>
          </div>`).join('')}
      </div>
    </div>
  `);
}

// ── PROVINCE ──
function renderProvince(code) {
  resetPies();
  const d = DATA.provinces[code];
  if (!d) return;
  const name = capitalize(d.name);

  const feat = geoProvinces.features.find(f =>
    String(f.properties.prov_istat_code).padStart(3,'0') === code
  );
  const regCode = feat ? String(feat.properties.reg_istat_code).padStart(2,'0') : null;
  const regName = regCode && DATA.regions[regCode] ? capitalize(DATA.regions[regCode].name) : '';

  // Comuni in this province sorted by cost
  const provComuni = Object.values(DATA.comuni)
    .filter(c => c.code.startsWith(code))
    .sort((a,b) => b.cost_total_eur - a.cost_total_eur);

  setBreadcrumb([
    {label:'Italia', action:'drillNational()'},
    ...(regCode ? [{label:regName, action:`drillRegion('${regCode}')`}] : []),
    {label:name, active:true},
  ]);
  setHeader(name, `Provincia · ${fmtN(d.n_projects)} progetti`);

  setSidebar(`
    <button class="back-btn" onclick="drillRegion('${regCode}')">← ${regName}</button>
    ${financingKpis(d)}
    ${statoBlock(d)}
    ${efficiencyBlock(d)}
    ${missioniBlock(d)}
    ${settoriBlock(d, 'green')}
    ${sottosettoriBlock(d, 'green')}
    ${categorieBlock(d)}
    ${natureBlock(d)}
    ${tipologieBlock(d)}
    ${fasiBlock(d)}
    ${soggettiBlock(d)}
    ${fontiBlock(d)}

    <div class="section">
      <div class="section-title">Comuni della provincia</div>
      <div class="drill-list">
        ${provComuni.slice(0,30).map(c=>`
          <div class="drill-item comune-item" onclick="renderComune('${c.code}')">
            <div style="flex:1">
              <div class="drill-item-name">${capitalize(c.name)}</div>
              <div class="drill-item-meta">${fmtN(c.n_projects)} proj · ${fmtN(c.n_overdue||0)} ritardi</div>
            </div>
            <div class="drill-item-cost">${fmtEur(c.cost_total_eur)}</div>
            <div class="drill-arrow" style="color:var(--green)">›</div>
          </div>`).join('')}
        ${provComuni.length > 30 ? `<div class="empty" style="padding:10px;font-size:11px">+ ${provComuni.length-30} comuni con dati</div>` : ''}
      </div>
    </div>
  `);
}

// ── COMUNE ──
function renderComune(code) {
  resetPies();
  state.selectedComune = code;
  const d = DATA.comuni[code];
  if (!d) return;
  const name = capitalize(d.name);

  // Highlight on map
  if (layerComuni) {
    layerComuni.eachLayer(layer => {
      const fCode = String(layer.feature.properties.com_istat_code);
      if (fCode === code) {
        layer.setStyle({ weight: 3, color: '#0A5A4A', fillOpacity: 0.95 });
        layer.bringToFront();
      } else {
        layerComuni.resetStyle(layer);
      }
    });
  }

  // Determine province & region for breadcrumb
  const provCode = state.drillProvince || code.substring(0,3);
  const provData = DATA.provinces[provCode];
  const provName = provData ? capitalize(provData.name) : '';

  const regCode = state.drillRegion;
  const regName = regCode && DATA.regions[regCode] ? capitalize(DATA.regions[regCode].name) : '';

  setBreadcrumb([
    {label:'Italia', action:'drillNational()'},
    ...(regCode ? [{label:regName, action:`drillRegion('${regCode}')`}] : []),
    ...(provCode ? [{label:provName, action:`goProvince('${provCode}')`}] : []),
    {label:name, active:true},
  ]);
  setHeader(name, `Comune · ${fmtN(d.n_projects)} progetti`);

  setSidebar(`
    <button class="back-btn" onclick="goProvince('${provCode}')">← ${provName}</button>

    <div class="comune-highlight">
      <div class="comune-highlight-icon">🏛</div>
      <div class="comune-highlight-text">
        <div class="lbl">Comune · Codice ISTAT</div>
        <div class="val">${code}</div>
      </div>
    </div>

    ${d.dominant_pct ? `
    <div style="background:#FFF8E1;border:1.5px solid #FFD54F;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:12px;color:#5D4037;">
      <div style="font-weight:700;margin-bottom:4px;">⚠️ Investimento concentrato (${d.dominant_pct}%)</div>
      <div style="color:#795548;">Un singolo progetto rappresenta il <b>${d.dominant_pct}%</b> del totale comunale (${fmtEur(d.dominant_cost)}): <i>"${d.dominant_desc}"</i>. Il costo potrebbe essere attribuito a un territorio più ampio.</div>
    </div>` : ''}

    <div class="kpi-grid">
      <div class="kpi accent">
        <div class="kpi-label">Investimento totale</div>
        <div class="kpi-value">${fmtEur(d.cost_total_eur)}</div>
        <div class="kpi-unit">Euro investiti</div>
      </div>
      <div class="kpi green-accent">
        <div class="kpi-label">Fin. PNRR</div>
        <div class="kpi-value">${fmtEur(d.fin_pnrr)}</div>
        <div class="kpi-unit">Quota PNRR</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Progetti</div>
        <div class="kpi-value">${fmtN(d.n_projects)}</div>
        <div class="kpi-unit">Codici CUP</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Gare</div>
        <div class="kpi-value">${fmtN(d.n_tenders)}</div>
        <div class="kpi-unit">Codici CIG</div>
      </div>
    </div>

    ${statoBlock(d)}
    ${efficiencyBlock(d)}
    ${missioniBlock(d)}
    ${settoriBlock(d, 'green')}
    ${sottosettoriBlock(d, 'green')}
    ${categorieBlock(d)}
    ${natureBlock(d)}
    ${tipologieBlock(d)}
    ${fasiBlock(d)}
    ${soggettiBlock(d)}
    ${fontiBlock(d)}
  `);
}

  setBreadcrumb([{label:'Italia', action:'drillNational()'},{label:'Province', active:true}]);

function renderAllComuni() {

    <div class="drill-list">
      ${top.map(c=>`
        <div class="drill-item comune-item" onclick="renderComune('${c.code}')">
          <div style="flex:1">
            <div class="drill-item-name">${capitalize(c.name)}</div>
            <div class="drill-item-meta">${fmtN(c.n_projects)} proj · ${fmtN(c.n_overdue||0)} ritardi</div>
          </div>
          <div class="drill-item-cost">${fmtEur(c.cost_total_eur)}</div>
          <div class="drill-arrow" style="color:var(--green)">›</div>
        </div>`).join('')}

// ═══════════════════════════════════════════════
// YEAR CHART
// ═══════════════════════════════════════════════
function drawYearChart(id, byYear) {
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
  const el = document.getElementById(id);
  if (!el) return;
  chartInstance = new Chart(el, {
    type: 'bar',
    data: {
      labels: byYear.map(([y])=>y),
      datasets: [{
        data: byYear.map(([,v])=>v),
        backgroundColor: '#6AAEE0',
        borderRadius: 4,
        borderSkipped: false,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 10 }, maxRotation: 45 } },
        y: { grid: { color: '#F0F0F0' }, ticks: { font: { size: 10 } } },
      },
    }
  });
}

// ═══════════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════════
function setBreadcrumb(items) {
  const el = document.getElementById('breadcrumb');
  el.innerHTML = items.map((item, i) =>
    `<span class="${item.active ? 'active' : ''}" ${item.action ? `onclick="${item.action}"` : ''}>${item.label}</span>` +
    (i < items.length - 1 ? `<span class="sep">›</span>` : '')
  ).join('');
}
function setHeader(title, sub) {
  document.getElementById('sidebar-title').textContent = title;
  document.getElementById('sidebar-subtitle').textContent = sub;
}
function setSidebar(html) {
  document.getElementById('sidebar-body').innerHTML = html;
  requestAnimationFrame(() => flushPieCharts());
}
function resetPies() { _pieIdx = 0; _pieQueue = []; }

// ═══════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════
loadData();
</script>
